name: release
on:
  push: { branches: [main] }
  workflow_dispatch: {}
permissions:
  id-token: write
  contents: read
jobs:
  dev:
    uses: ./.github/workflows/deploy.yml
    with: { environment: dev, role-arn: "arn:aws:iam::725224325250:role/pc21-deploy-dev" }
  prod:
    needs: dev
    uses: ./.github/workflows/deploy.yml
    with: { environment: prod, role-arn: "arn:aws:iam::725224325250:role/pc21-deploy-dev" }
